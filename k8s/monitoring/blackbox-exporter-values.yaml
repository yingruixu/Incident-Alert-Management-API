fullnameOverride: incident-blackbox-exporter
releaseLabel: false

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4
    https_cert:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4
        fail_if_not_ssl: true

serviceMonitor:
  enabled: false
  defaults:
    labels:
      release: monitoring
    interval: 30s
    scrapeTimeout: 10s
    module: http_2xx
  targets:
    - name: incident-frontend
      url: http://frontend.incident.svc.cluster.local/
      labels:
        job: incident-frontend

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi